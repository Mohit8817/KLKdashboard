<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Editor</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
      padding: 30px 15px;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .form-Control {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #ececec;
    }

    .form-Control form {
      width: 100%;
    }

    .inputBox {
      margin-bottom: 18px;
    }

    .input-field {
      width: 100%;
      padding: 14px 15px;
      border-radius: 10px;
      border: 1px solid #d8d8d8;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
      background-color: #fafafa;
    }

    .input-field:focus {
      border-color: #940000;
      background-color: white;
      box-shadow: 0 0 0 4px rgba(148, 0, 0, 0.08);
    }

    textarea.input-field {
      resize: none;
      height: 90px;
    }

    .buttons_upload {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed #b7b7b7;
      background-color: #fafafa;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #940000, #c40000);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(148, 0, 0, 0.2);
    }

    .main {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 720px;
      width: 100%;
    }

    .whole {
      background: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #ececec;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 100%;
      width: fit-content;
      margin: 0 auto;
    }

    .EditImage {
      position: relative;
      display: inline-block;
      line-height: 0;
      max-width: 100%;
      background-color: #1a1a1a;
      overflow: hidden;
    }

    #previewImg {
      display: none;
      max-width: 100%;
      max-height: 520px;
      width: auto;
      height: auto;
      object-fit: contain;
      vertical-align: middle;
    }

    .image-placeholder {
      width: 580px;
      height: 380px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #777;
      gap: 12px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      border: 2px dashed #d8d8d8;
      border-radius: 12px;
      transition: 0.3s;
    }

    .image-placeholder:hover {
      border-color: #940000;
      background: #fff8f8;
    }

    .image-placeholder p {
      font-size: 16px;
      font-weight: 600;
      color: #444;
      line-height: 1.4;
    }

    .image-placeholder span {
      font-size: 13px;
      color: #888;
      line-height: 1.4;
    }

    /* NORMAL PREVIEW STYLE */

    .content {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 0.82rem;
      line-height: 1.35;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      max-width: 75%;
      word-break: break-word;
      z-index: 5;
      pointer-events: none;
    }

    .content:empty {
      display: none !important;
    }

    .content p {
      color: white;
      margin-bottom: 2px;
      line-height: 1.35;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .content p:last-child {
      margin-bottom: 0;
    }

    #Download {
      margin-top: 18px;
      position: static;
      max-width: 250px;
      border-radius: 10px;
    }

    /* DOWNLOAD MODE */

    .download-mode .content {
      left: 4px !important;
      bottom: 4px !important;
      background: rgba(255, 255, 255, 0.75) !important;
      padding: 4px 8px !important;
      border-radius: 0px !important;
      backdrop-filter: none !important;
    }

    .download-mode .content p {
      color: black !important;
      font-weight: 600 !important;
      margin-bottom: 0px !important;
      line-height: 1.2 !important;
      font-size: 12px !important;
    }

    .powerText {
      position: absolute;
      bottom: 8px;
      right: 8px;
      color: red;
      font-size: 16px;
      font-style: italic;
      font-weight: bold;
      line-height: 1.2;
      display: none;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .download-mode .powerText {
      display: block !important;
      bottom: 6px !important;
      right: 6px !important;
      font-size: 16px !important;
      text-shadow: none !important;
    }

    @media screen and (max-width: 768px) {

      body {
        padding: 20px 10px;
      }

      .container {
        flex-direction: column;
        align-items: center;
      }

      .form-Control {
        max-width: 100%;
      }

      .whole {
        width: 100%;
      }

      .main {
        width: 100%;
      }

      #previewImg {
        max-height: 420px;
      }

      .image-placeholder {
        width: 100%;
        height: 280px;
      }
    }

    @media screen and (max-width: 468px) {

      #previewImg {
        max-height: 320px;
      }

      .image-placeholder {
        height: 220px;
      }

      .content {
        font-size: 0.72rem;
        padding: 6px 8px;
      }

      .input-field,
      button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="form-Control">

      <form>

              <!-- IMAGE -->

        <div class="btns inputBox">
          <input class="buttons_upload" type="file" id="imageAccept">
        </div>

        <div class="inputBox">
          <input class="input-field" id="latitude" type="text" placeholder="Enter Latitude">
        </div>

        <div class="inputBox">
          <input class="input-field" type="text" id="longitude" placeholder="Enter Longitude">
        </div>

        <div class="inputBox">
          <input class="input-field" type="text" id="Elevation" placeholder="Enter Elevation">
        </div>

        <div class="inputBox">
          <input class="input-field" type="text" id="Accuracy" placeholder="Enter Accuracy">
        </div>

        <!-- DATE TIME -->

        <div class="inputBox">
          <input class="input-field" type="datetime-local" id="DateTime">
        </div>

        <!-- NOTE -->

        <div class="inputBox">
          <textarea class="input-field" id="Note" placeholder="Enter Note"></textarea>
        </div>

  

        <button type="submit">Convert</button>

      </form>

    </div>

    <div class="main">

      <div class="whole">

        <div class="EditImage" id="setBack">

          <img id="previewImg" alt="Preview Image" />

          <!-- PLACEHOLDER WHEN NO IMAGE -->
          <div id="imagePlaceholder" class="image-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p>No image selected</p>
            <span>Click or choose an image from the form</span>
          </div>

          <div class="content"></div>

          <!-- POWERED TEXT -->

          <div class="powerText">
            Powered by NoteCam
          </div>

        </div>

      </div>

      <button id="Download" onclick="downloadJPG()">
        Download Image
      </button>

    </div>

  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <script>

    const form = document.querySelector("form");
    const image = document.querySelector("#imageAccept");
    const setBack = document.getElementById("setBack");
    const previewImg = document.getElementById("previewImg");
    const placeholder = document.getElementById("imagePlaceholder");
    const divAdd = document.querySelector(".content");

    if (placeholder) {
      placeholder.addEventListener("click", () => {
        image.click();
      });
    }

    // IMAGE PREVIEW

    image.addEventListener("change", () => {

      if (image.files && image.files.length > 0) {

        let fileReader = new FileReader();

        fileReader.readAsDataURL(image.files[0]);

        fileReader.onloadend = function () {

          if (placeholder) placeholder.style.display = "none";
          previewImg.style.display = "block";
          previewImg.src = fileReader.result;

        };

      }

    });

    // FORMAT DATE TIME

    function formatDateTime(dateTime) {

      let [date, time] = dateTime.split("T");

      let [year, month, day] = date.split("-");

      return `${day}-${month}-${year} ${time}`;

    }

    // FORM SUBMIT

    form.addEventListener("submit", (e) => {

      e.preventDefault();

      const latitude = document.querySelector("#latitude").value;
      const longitude = document.querySelector("#longitude").value;
      const elevation = document.querySelector("#Elevation").value;
      const accuracy = document.querySelector("#Accuracy").value;

      const rawDateTime = document.querySelector("#DateTime").value;

      const note = document.querySelector("#Note").value;

      if (
        latitude === "" ||
        longitude === "" ||
        elevation === "" ||
        accuracy === "" ||
        rawDateTime === "" ||
        note === ""
      ) {

        alert("Please Enter The Full Detail");

      } else {

        // CLEAR OLD DATA

        divAdd.innerHTML = "";

        let lat = newLatLong(latitude);
        let long = newLatLong(longitude);

        // FORMAT DATE

        const formattedDateTime = formatDateTime(rawDateTime);

        paragraphAppend(`Latitude: ${lat}`);
        paragraphAppend(`Longitude: ${long}`);
        paragraphAppend(`Elevation: ${elevation}`);
        paragraphAppend(`Accuracy: ${accuracy}`);
        paragraphAppend(`Time: ${formattedDateTime}`);
        paragraphAppend(`Note: ${note}`);

      }

    });

    // CREATE PARAGRAPH

    function paragraphAppend(value) {

      const p = document.createElement("p");

      p.innerText = value;

      divAdd.appendChild(p);

    }

    // LIMIT LAT LONG

    function newLatLong(latLong) {

      let latLongStr = latLong.toString().trim();

      let newLat = "";

      let count = 0;

      for (let i of latLongStr) {

        if (count === 9) {
          break;
        } else {
          newLat += i;
          count++;
        }

      }

      return newLat;

    }

    // DOWNLOAD IMAGE

    async function downloadJPG() {

      if (!image.files || image.files.length === 0 || !previewImg.src) {
        alert("Please select an image first.");
        return;
      }

      if (divAdd.innerHTML.trim() === "") {
        alert("Please click Convert first.");
        return;
      }

      let element = document.getElementById("setBack");

      // ENABLE DOWNLOAD MODE
      element.classList.add("download-mode");

      // Calculate scale to maintain high resolution of the image
      let naturalW = (previewImg && previewImg.naturalWidth) || element.offsetWidth;
      let naturalH = (previewImg && previewImg.naturalHeight) || element.offsetHeight;
      let maxDim = Math.max(naturalW, naturalH);
      let targetW = naturalW;
      if (maxDim > 4096) {
        let reduction = 4096 / maxDim;
        targetW = Math.round(naturalW * reduction);
      }
      let currentW = element.offsetWidth || 1;
      let scale = targetW / currentW;
      if (scale < 1.5) scale = 2;

      await new Promise((resolve) => requestAnimationFrame(resolve));

      try {

        const canvas = await html2canvas(element, {
          scale: scale,
          useCORS: true,
          logging: false
        });

        let dataURL = canvas.toDataURL("image/jpeg", 0.95);

        let link = document.createElement("a");

        link.href = dataURL;

        link.download = "Image.jpg";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

      } catch (err) {
        console.error("Download error:", err);
        alert("Error generating image: " + err.message);
      } finally {
        // REMOVE DOWNLOAD MODE
        element.classList.remove("download-mode");
      }

    }

  </script>

</body>

</html>
