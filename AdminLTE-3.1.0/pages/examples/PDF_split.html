<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF Splitter — Remove Pages</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
    padding: 30px 15px;
  }
  .container { max-width: 1250px; margin: auto; }
  h1 { text-align:center; color:#2b2b2b; margin-bottom: 6px; font-size: 28px; }
  .subtitle { text-align:center; color:#666; margin-bottom: 26px; font-size: 14px; }

  /* UPLOAD / DROPZONE */
  .upload-box {
    max-width: 560px;
    margin: 0 auto 26px;
    background:#fff;
    padding: 26px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border: 1px solid #ececec;
  }
  .dropzone {
    width:100%;
    padding: 30px 16px;
    border-radius: 12px;
    border: 2px dashed #c7c7c7;
    background-color: #fafafa;
    text-align:center;
    cursor:pointer;
    transition: 0.2s;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: #940000;
    background-color: rgba(148,0,0,0.04);
  }
  .dropzone .icon { font-size: 32px; margin-bottom: 8px; }
  .dropzone .main-text { font-size: 15px; color:#333; font-weight: 600; }
  .dropzone .sub-text { font-size: 12.5px; color:#888; margin-top:4px; }
  #pdfInput { display:none; }
  .hint { font-size:12px; color:#888; margin-top:10px; text-align:center; }

  /* TOASTS */
  .toast-stack {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 1000;
    display:flex;
    flex-direction:column;
    gap: 10px;
    max-width: 320px;
  }
  .toast {
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    color:#fff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    animation: slideIn 0.25s ease;
    line-height:1.4;
  }
  .toast.error { background: linear-gradient(135deg, #940000, #c40000); }
  .toast.success { background: linear-gradient(135deg, #1a5f2a, #2a8f43); }
  .toast.info { background: linear-gradient(135deg, #35507a, #4a6ea5); }
  @keyframes slideIn {
    from { transform: translateX(30px); opacity:0; }
    to { transform: translateX(0); opacity:1; }
  }

  .layout {
    display:flex;
    gap: 22px;
    align-items:flex-start;
    flex-wrap: wrap;
  }

  /* FILE LIST SIDEBAR — sticky wrapper + independently scrolling list */
  .file-list {
    width: 290px;
    background:#fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border: 1px solid #ececec;
    padding: 16px;
    flex-shrink:0;
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    display:flex;
    flex-direction:column;
  }
  .file-list h3 { font-size:14px; color:#333; margin-bottom:10px; flex-shrink:0; }
  #fileListItems {
    overflow-y: auto;
    padding-right: 4px;
  }
  #fileListItems::-webkit-scrollbar { width: 6px; }
  #fileListItems::-webkit-scrollbar-thumb { background: #d8d8d8; border-radius: 10px; }
  #fileListItems::-webkit-scrollbar-thumb:hover { background: #b8b8b8; }
  .file-item {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor:pointer;
    border: 1px solid #eee;
    background:#fafafa;
    transition: 0.2s;
  }
  .file-item:hover { background:#f0f0f0; }
  .file-item.active {
    border-color:#940000;
    background: rgba(148,0,0,0.06);
  }
  .file-item .fname {
    font-size: 13px;
    color:#333;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width: 175px;
  }
  .file-item .fmeta { font-size:11px; color:#888; margin-top:2px; }
  .file-item .fmeta.warn { color:#c40000; font-weight:600; }
  .file-item .fclose {
    color:#c40000;
    font-weight:bold;
    font-size:16px;
    line-height:1;
    padding: 2px 8px;
    border-radius:6px;
    flex-shrink:0;
  }
  .file-item .fclose:hover { background: rgba(196,0,0,0.1); }

  /* MAIN EDITOR AREA */
  .editor {
    flex:1;
    min-width: 320px;
    background:#fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border: 1px solid #ececec;
    padding: 22px;
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    display:flex;
    flex-direction:column;
  }
  .editor-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 16px;
    flex-wrap:wrap;
    gap:10px;
    border-bottom: 1px solid #f0f0f0;
    padding-bottom: 14px;
    flex-shrink: 0;
  }
  #pageArea {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding-right: 4px;
  }
  #pageArea::-webkit-scrollbar { width: 6px; }
  #pageArea::-webkit-scrollbar-thumb { background: #d8d8d8; border-radius: 10px; }
  #pageArea::-webkit-scrollbar-thumb:hover { background: #b8b8b8; }
  .editor-header .name { font-weight:bold; color:#2b2b2b; font-size:15px; word-break:break-all; }
  .editor-header .count { font-size:12.5px; color:#777; margin-top:2px; }
  .select-tools { display:flex; gap:8px; }
  .select-tools button {
    padding: 8px 12px;
    font-size: 12px;
    width:auto;
  }

  .empty-state {
    text-align:center;
    color:#999;
    padding: 70px 20px;
    font-size: 14.5px;
  }
  .empty-state .icon { font-size: 38px; display:block; margin-bottom:10px; }

  .page-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
  }
  .page-thumb {
    position:relative;
    border: 2px solid #e5e5e5;
    border-radius: 10px;
    overflow:hidden;
    cursor:pointer;
    background:#fafafa;
    transition: 0.2s;
  }
  .page-thumb:hover { border-color:#c4000088; transform: translateY(-2px); }
  .page-thumb.removed {
    opacity: 0.45;
    border-color: #c40000;
  }
  .page-thumb img { width:100%; display:block; min-height: 90px; background:#eee; }
  .page-num {
    text-align:center;
    font-size: 12px;
    color:#555;
    padding: 6px 0;
    background:#fff;
    border-top: 1px solid #eee;
  }
  .removed .page-num { color:#c40000; font-weight:bold; }
  .remove-badge {
    position:absolute;
    top:6px;
    right:6px;
    background:#c40000;
    color:#fff;
    font-size: 14px;
    font-weight:bold;
    width:22px;
    height:22px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .removed .remove-badge { display:flex; }

  .loading-msg {
    text-align:center;
    color:#940000;
    font-size:13px;
    padding: 40px 20px;
  }
  .spinner {
    width: 26px; height: 26px;
    border: 3px solid #eee;
    border-top-color: #940000;
    border-radius: 50%;
    margin: 0 auto 10px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .action-bar {
    display:flex;
    gap: 12px;
    margin-top: 22px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  button {
    padding: 13px 18px;
    background: linear-gradient(135deg, #940000, #c40000);
    color:white;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(148,0,0,0.2); }
  button:disabled { opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none; }
  button.secondary {
    background: #fff;
    color:#940000;
    border: 1px solid #940000;
  }
  button.secondary:hover:not(:disabled) { box-shadow: 0 8px 20px rgba(148,0,0,0.08); }
  button.download-all {
    background: linear-gradient(135deg, #1a5f2a, #2a8f43);
  }
  button.download-all:hover:not(:disabled) { box-shadow: 0 8px 20px rgba(30,100,50,0.2); }

  @media screen and (max-width: 768px) {
    .layout { flex-direction:column; }
    .file-list {
      width:100%;
      position: static;
      max-height: 260px;
    }
    .editor {
      position: static;
      max-height: none;
    }
    #pageArea { overflow-y: visible; }
    .editor-header { flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="toast-stack" id="toastStack"></div>

<div class="container">
  <h1>PDF Splitter</h1>
  <p class="subtitle">Upload a PDF, remove the pages you don't need, and download it with its original filename</p>

  <div class="upload-box">
    <div class="dropzone" id="dropzone">
      <div class="icon">📄</div>
      <div class="main-text">Click to select PDF files</div>
      <div class="sub-text">or drag and drop them here</div>
      <input type="file" id="pdfInput" accept="application/pdf,.pdf" multiple>
    </div>
    <div class="hint">You can select one or multiple PDF files (PDF format only)</div>
  </div>

  <div class="layout" id="layout" style="display:none;">
    <div class="file-list">
      <h3>Uploaded PDFs</h3>
      <div id="fileListItems"></div>
    </div>

    <div class="editor">
      <div class="editor-header">
        <div>
          <div class="name" id="activeFileName">—</div>
          <div class="count" id="activeFileCount"></div>
        </div>
        <div class="select-tools">
          <button class="secondary" id="selectAllBtn" disabled onclick="selectAllPages()">Mark All</button>
          <button class="secondary" id="resetBtn" disabled onclick="resetCurrentSelection()">Clear Selection</button>
        </div>
      </div>

      <div id="pageArea">
        <div class="empty-state">
          <span class="icon">🗂️</span>
          No PDF selected yet — upload a file to get started
        </div>
      </div>

      <div class="action-bar">
        <button id="removeBtn" disabled onclick="downloadCurrent()">Remove Selected Pages & Download</button>
        <button class="download-all" id="downloadAllBtn" disabled onclick="downloadAll()">Download All PDFs (ZIP)</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const MAX_FILE_SIZE_MB = 60;

  // Each entry: { name, bytes(ArrayBuffer), numPages, removed:Set, thumbs:[dataURL], loadError:boolean }
  let files = [];
  let activeIndex = -1;

  const pdfInput = document.getElementById("pdfInput");
  const dropzone = document.getElementById("dropzone");
  const layout = document.getElementById("layout");
  const fileListItems = document.getElementById("fileListItems");
  const pageArea = document.getElementById("pageArea");
  const activeFileName = document.getElementById("activeFileName");
  const activeFileCount = document.getElementById("activeFileCount");
  const removeBtn = document.getElementById("removeBtn");
  const resetBtn = document.getElementById("resetBtn");
  const selectAllBtn = document.getElementById("selectAllBtn");
  const downloadAllBtn = document.getElementById("downloadAllBtn");
  const toastStack = document.getElementById("toastStack");

  // ---------- TOAST HELPER ----------
  function showToast(message, type = "info", duration = 4000) {
    const toast = document.createElement("div");
    toast.className = "toast " + type;
    toast.textContent = message;
    toastStack.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = "0";
      toast.style.transition = "opacity 0.3s";
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  // ---------- DROPZONE INTERACTIONS ----------
  dropzone.addEventListener("click", () => pdfInput.click());

  dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("dragover");
  });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    handleIncomingFiles(e.dataTransfer.files);
  });

  pdfInput.addEventListener("change", () => {
    handleIncomingFiles(pdfInput.files);
    pdfInput.value = "";
  });

  // ---------- VALIDATION + FILE HANDLING ----------
  async function handleIncomingFiles(fileListRaw) {
    const incoming = Array.from(fileListRaw || []);
    if (incoming.length === 0) return;

    const validFiles = [];
    let rejectedCount = 0;
    let oversizedCount = 0;
    let duplicateCount = 0;

    for (const f of incoming) {
      const isPdfType = f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf");
      if (!isPdfType) {
        rejectedCount++;
        continue;
      }
      const sizeMb = f.size / (1024 * 1024);
      if (sizeMb > MAX_FILE_SIZE_MB) {
        oversizedCount++;
        continue;
      }
      if (f.size === 0) {
        rejectedCount++;
        continue;
      }
      const alreadyAdded = files.some((existing) => existing.name === f.name && existing.bytes.byteLength === f.size);
      if (alreadyAdded) {
        duplicateCount++;
        continue;
      }
      validFiles.push(f);
    }

    if (rejectedCount > 0) {
      showToast(`${rejectedCount} file(s) skipped — only PDF files are supported.`, "error");
    }
    if (oversizedCount > 0) {
      showToast(`${oversizedCount} file(s) skipped — file size exceeds ${MAX_FILE_SIZE_MB} MB limit.`, "error");
    }
    if (duplicateCount > 0) {
      showToast(`${duplicateCount} file(s) skipped — already uploaded.`, "info");
    }
    if (validFiles.length === 0) return;

    const startIdx = files.length;
    for (const f of validFiles) {
      try {
        const bytes = await f.arrayBuffer();
        files.push({
          name: f.name,
          bytes: bytes,
          numPages: 0,
          removed: new Set(),
          thumbs: [],
          loadError: false
        });
      } catch (err) {
        showToast(`Could not read "${f.name}". Please try again.`, "error");
      }
    }

    if (files.length === startIdx) return;

    layout.style.display = "flex";
    renderFileList();

    for (let i = startIdx; i < files.length; i++) {
      await loadThumbnails(i);
    }

    if (activeIndex === -1) {
      selectFile(startIdx);
    } else {
      renderFileList();
    }

    updateDownloadAllState();
    showToast(`${validFiles.length} PDF(s) added successfully.`, "success");
  }

  // ---------- LOAD PAGE THUMBNAILS ----------
  async function loadThumbnails(idx) {
    const entry = files[idx];
    if (idx === activeIndex) renderPageGrid(); // show loading state immediately

    try {
      const loadingTask = pdfjsLib.getDocument({ data: entry.bytes.slice(0) });
      const pdf = await loadingTask.promise;
      entry.numPages = pdf.numPages;
      entry.thumbs = new Array(pdf.numPages);

      if (pdf.numPages === 0) {
        entry.loadError = true;
        showToast(`"${entry.name}" has no readable pages.`, "error");
        renderFileList();
        if (idx === activeIndex) renderPageGrid();
        return;
      }

      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: 0.45 });
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext("2d");
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        entry.thumbs[p - 1] = canvas.toDataURL("image/jpeg", 0.75);
        if (idx === activeIndex) renderPageGrid();
      }
    } catch (err) {
      entry.loadError = true;
      showToast(`"${entry.name}" could not be opened — it may be corrupted, encrypted, or password-protected.`, "error", 6000);
    }

    renderFileList();
    if (idx === activeIndex) renderPageGrid();
  }

  // ---------- FILE LIST SIDEBAR ----------
  function renderFileList() {
    fileListItems.innerHTML = "";
    files.forEach((entry, idx) => {
      const item = document.createElement("div");
      item.className = "file-item" + (idx === activeIndex ? " active" : "");
      item.onclick = (e) => {
        if (e.target.classList.contains("fclose")) return;
        selectFile(idx);
      };
      const info = document.createElement("div");
      const nameEl = document.createElement("div");
      nameEl.className = "fname";
      nameEl.textContent = entry.name;
      nameEl.title = entry.name;
      const meta = document.createElement("div");
      const removedCount = entry.removed.size;

      if (entry.loadError) {
        meta.className = "fmeta warn";
        meta.textContent = "Failed to load";
      } else if (!entry.numPages) {
        meta.className = "fmeta";
        meta.textContent = "Loading...";
      } else {
        meta.className = "fmeta";
        meta.textContent = `${entry.numPages} pages${removedCount ? ` · ${removedCount} marked for removal` : ""}`;
      }

      info.appendChild(nameEl);
      info.appendChild(meta);

      const close = document.createElement("div");
      close.className = "fclose";
      close.textContent = "×";
      close.title = "Remove this PDF from the list";
      close.onclick = (e) => {
        e.stopPropagation();
        removeFile(idx);
      };

      item.appendChild(info);
      item.appendChild(close);
      fileListItems.appendChild(item);
    });
  }

  function removeFile(idx) {
    const removedName = files[idx].name;
    files.splice(idx, 1);
    if (files.length === 0) {
      activeIndex = -1;
      layout.style.display = "none";
    } else if (activeIndex === idx) {
      selectFile(Math.max(0, idx - 1));
    } else if (activeIndex > idx) {
      activeIndex--;
      renderFileList();
    } else {
      renderFileList();
    }
    updateDownloadAllState();
    showToast(`"${removedName}" removed from the list.`, "info", 2500);
  }

  function selectFile(idx) {
    activeIndex = idx;
    renderFileList();
    renderPageGrid();
  }

  // ---------- PAGE GRID ----------
  function renderPageGrid() {
    const entry = files[activeIndex];
    if (!entry) {
      pageArea.innerHTML = '<div class="empty-state"><span class="icon">🗂️</span>No PDF selected yet — upload a file to get started</div>';
      activeFileName.textContent = "—";
      activeFileCount.textContent = "";
      removeBtn.disabled = true;
      resetBtn.disabled = true;
      selectAllBtn.disabled = true;
      return;
    }

    activeFileName.textContent = entry.name;

    if (entry.loadError) {
      activeFileCount.textContent = "This file could not be opened";
      pageArea.innerHTML = '<div class="empty-state"><span class="icon">⚠️</span>Unable to load this PDF. It may be corrupted, encrypted, or password-protected. Please remove it and try another file.</div>';
      removeBtn.disabled = true;
      resetBtn.disabled = true;
      selectAllBtn.disabled = true;
      return;
    }

    if (!entry.numPages) {
      activeFileCount.textContent = "Loading pages...";
      pageArea.innerHTML = '<div class="loading-msg"><div class="spinner"></div>Loading pages...</div>';
      removeBtn.disabled = true;
      resetBtn.disabled = true;
      selectAllBtn.disabled = true;
      return;
    }

    const remaining = entry.numPages - entry.removed.size;
    activeFileCount.textContent = `${entry.numPages} pages total · ${remaining} will remain · click a page to mark it for removal`;

    removeBtn.disabled = entry.removed.size === 0;
    resetBtn.disabled = entry.removed.size === 0;
    selectAllBtn.disabled = entry.removed.size === entry.numPages;

    const grid = document.createElement("div");
    grid.className = "page-grid";

    for (let i = 0; i < entry.numPages; i++) {
      const thumb = document.createElement("div");
      thumb.className = "page-thumb" + (entry.removed.has(i) ? " removed" : "");
      thumb.onclick = () => {
        if (entry.removed.has(i)) entry.removed.delete(i);
        else entry.removed.add(i);
        renderPageGrid();
        renderFileList();
      };

      const badge = document.createElement("div");
      badge.className = "remove-badge";
      badge.textContent = "×";

      const img = document.createElement("img");
      img.src = entry.thumbs[i] || "";
      img.alt = "Page " + (i + 1);

      const num = document.createElement("div");
      num.className = "page-num";
      num.textContent = "Page " + (i + 1);

      thumb.appendChild(img);
      thumb.appendChild(badge);
      thumb.appendChild(num);
      grid.appendChild(thumb);
    }

    pageArea.innerHTML = "";
    pageArea.appendChild(grid);
  }

  function resetCurrentSelection() {
    const entry = files[activeIndex];
    if (!entry) return;
    entry.removed.clear();
    renderPageGrid();
    renderFileList();
  }

  function selectAllPages() {
    const entry = files[activeIndex];
    if (!entry || !entry.numPages) return;
    for (let i = 0; i < entry.numPages; i++) entry.removed.add(i);
    renderPageGrid();
    renderFileList();
  }

  // ---------- BUILD SPLIT PDF ----------
  async function buildSplitPdf(entry) {
    if (entry.loadError) {
      showToast(`Skipping "${entry.name}" — this file could not be opened.`, "error");
      return null;
    }
    try {
      const { PDFDocument } = PDFLib;
      const srcDoc = await PDFDocument.load(entry.bytes.slice(0));
      const totalPages = srcDoc.getPageCount();
      const keepIndices = [];
      for (let i = 0; i < totalPages; i++) {
        if (!entry.removed.has(i)) keepIndices.push(i);
      }
      if (keepIndices.length === 0) {
        showToast(`"${entry.name}" — cannot remove all pages. At least 1 page must remain.`, "error", 5000);
        return null;
      }
      const newDoc = await PDFDocument.create();
      const copiedPages = await newDoc.copyPages(srcDoc, keepIndices);
      copiedPages.forEach((p) => newDoc.addPage(p));
      return await newDoc.save();
    } catch (err) {
      showToast(`Something went wrong while processing "${entry.name}". Please try again.`, "error", 5000);
      return null;
    }
  }

  async function downloadCurrent() {
    const entry = files[activeIndex];
    if (!entry) return;

    if (entry.removed.size === 0) {
      showToast("Please mark at least one page for removal before downloading.", "info");
      return;
    }

    removeBtn.disabled = true;
    const originalText = removeBtn.textContent;
    removeBtn.textContent = "Processing...";
    try {
      const bytes = await buildSplitPdf(entry);
      if (bytes) {
        triggerDownload(bytes, entry.name);
        showToast(`"${entry.name}" downloaded successfully.`, "success");
      }
    } finally {
      removeBtn.disabled = entry.removed.size === 0;
      removeBtn.textContent = originalText;
    }
  }

  function triggerDownload(bytes, filename) {
    const blob = new Blob([bytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename; // same name as uploaded
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function updateDownloadAllState() {
    downloadAllBtn.disabled = files.length < 1;
  }

  async function downloadAll() {
    if (files.length === 0) {
      showToast("Please upload at least one PDF first.", "info");
      return;
    }

    const usableFiles = files.filter((f) => !f.loadError);
    if (usableFiles.length === 0) {
      showToast("No valid PDFs available to download.", "error");
      return;
    }

    downloadAllBtn.disabled = true;
    const originalText = downloadAllBtn.textContent;
    downloadAllBtn.textContent = "Preparing...";

    try {
      if (usableFiles.length === 1) {
        const bytes = await buildSplitPdf(usableFiles[0]);
        if (bytes) {
          triggerDownload(bytes, usableFiles[0].name);
          showToast(`"${usableFiles[0].name}" downloaded successfully.`, "success");
        }
        return;
      }

      const zip = new JSZip();
      const usedNames = new Set();
      let successCount = 0;

      for (const entry of usableFiles) {
        const bytes = await buildSplitPdf(entry);
        if (!bytes) continue;
        let name = entry.name;
        if (usedNames.has(name)) {
          const dot = name.lastIndexOf(".");
          const base = dot !== -1 ? name.slice(0, dot) : name;
          const ext = dot !== -1 ? name.slice(dot) : "";
          let n = 2;
          while (usedNames.has(`${base}(${n})${ext}`)) n++;
          name = `${base}(${n})${ext}`;
        }
        usedNames.add(name);
        zip.file(name, bytes);
        successCount++;
      }

      if (successCount === 0) {
        showToast("No PDFs could be processed.", "error");
        return;
      }

      const content = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(content);
      const link = document.createElement("a");
      link.href = url;
      link.download = "Split-PDFs.zip";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast(`${successCount} PDF(s) downloaded as ZIP.`, "success");
    } finally {
      downloadAllBtn.disabled = false;
      downloadAllBtn.textContent = originalText;
    }
  }
</script>
</body>
