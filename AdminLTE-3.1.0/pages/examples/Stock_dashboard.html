    <style>
        .hamburger {
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .hamburger input {
            display: none;
        }

        .hamburger svg {
            height: 2.2em;
            transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .line {
            fill: none;
            stroke: #255267;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 3;
            transition: stroke-dasharray 600ms cubic-bezier(0.4, 0, 0.2, 1),
                stroke-dashoffset 600ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .line-top-bottom {
            stroke-dasharray: 12 63;
        }

        .hamburger input:checked+svg {
            transform: rotate(-45deg);
        }

        .hamburger input:checked+svg .line-top-bottom {
            stroke-dasharray: 20 300;
            stroke-dashoffset: -32.42;
        }
    </style>

    <style>
        .custom-sidebar {
            background: #2b5c6f !important;
            overflow: hidden;
        }

        .profile-area {
            padding: 12px 12px;
            text-align: center;
        }

        .profile-area img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, .4);
        }

        .profile-area h4 {
            margin-top: 8px;
            font-size: 18px;
            color: #fff;
        }

        .profile-area span {
            font-size: 12px;
            color: #cfe8f3;
        }

        .custom-menu {
            padding: 2px 8px;
        }

        .custom-menu .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 50px 0 0 50px;
            padding: 8px 18px;
            color: #fff !important;
            transition: .3s;
        }

        .custom-menu .nav-link:hover {
            background: rgba(255, 255, 255, .1);
        }

        .custom-menu .nav-link.active {
            background: #d7e8f2 !important;
            color: #2b5c6f !important;
            box-shadow: 0 4px 10px rgba(0,0,0,.08);
            font-weight: bold;
        }

        .custom-menu .nav-icon {
            font-size: 15px;
        }

        .logout-admin {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ffb3b3;
            display: flex;
            gap: 10px;
            cursor: pointer;
        }
    </style>
